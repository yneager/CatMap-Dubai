# Checks every push and pull request: unit tests, lint and a debug build, plus the Firestore
# security-rules suite against the local emulator. Needs no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      # The screenshot tests still run here (rendering, poster QR decode), but pixel comparison
      # (:app:verifyRoborazziDebug) is a local check: the reference images were recorded on Windows, and
      # Linux renders text slightly differently, so a pixel compare on this runner would fail on every run.
      - run: ./gradlew --no-daemon --no-parallel --max-workers=1 :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm --prefix tools/rulestest ci
      - run: >
          npx -y firebase-tools@latest emulators:exec --config firebase.rules-test.json --only firestore
          --project demo-catmap-rules-test "npm --prefix tools/rulestest test"
