# Android/web/worker checks plus Firestore, Storage and browser suites in demo emulators.
# Needs no secrets and uses a read-only repository token.
#
# Every action is pinned to a full commit SHA (the tag is in the comment), so a moved or hijacked tag can't change
# what runs. Dependabot (.github/dependabot.yml) proposes updates to these pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # The runner image ships the Android SDK; only the platform and build tools this app needs are added, with
      # Google's own sdkmanager (the release workflow does the same, so this run also checks that step).
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The screenshot tests still run here (rendering, poster QR decode), but pixel comparison
      # (:app:verifyRoborazziDebug) is a local check: the reference images were recorded on Windows, and
      # Linux renders text slightly differently, so a pixel compare on this runner would fail on every run.
      - run: ./gradlew --no-daemon --no-parallel --max-workers=1 :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --prefix tools/rulestest ci
      - run: >
          npx -y firebase-tools@15.34.0 emulators:exec --config firebase.storage-test.json --only firestore,storage
          --project demo-catmap-rules-test "npm --prefix tools/rulestest test"

  # The push function is Blaze-only and not deployed; this keeps it working through dependency updates.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --prefix functions ci
      - run: >
          npx -y firebase-tools@15.34.0 emulators:exec --config firebase.rules-test.json --only firestore
          --project demo-catmap-functions "npm --prefix functions test"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run typecheck && npm run test && npm run build && npm run strings:check
        working-directory: web
      - run: python tools/strings/build_strings.py . --check
      - run: python tools/icons/vector_to_svg.py . --check
      - run: git diff --exit-code -- app/src/main/res/values/strings.xml app/src/main/res/values-ar/strings.xml

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python3 -m venv .ci-worker
      - run: .ci-worker/bin/python -m pip install -r tools/worker/requirements-test.txt
      - run: .ci-worker/bin/python tools/worker/tests/run.py
      - run: >
          npx -y firebase-tools@15.34.0 emulators:exec --config firebase.rules-test.json --only firestore
          --project demo-catmap-recovery ".ci-worker/bin/python tools/worker/tests/test_recovery_synthetic.py"
      - run: .ci-worker/bin/python tools/migrate/test_schema_backfill.py
      - run: npm --prefix tools/rulestest ci
      - run: >
          npx -y firebase-tools@15.34.0 emulators:exec --config firebase.rules-test.json --only firestore
          --project demo-catmap-backfill ".ci-worker/bin/python tools/migrate/test_schema_backfill_emulator.py && node tools/rulestest/after-backfill.mjs"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      VITE_USE_EMULATORS: 'true'
      VITE_EMULATOR_PROJECT_ID: demo-catmap-web-test
      CATMAP_EMULATOR_PROJECT: demo-catmap-web-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: >
          npx -y firebase-tools@15.34.0 emulators:exec --config firebase.browser-test.json --only auth,firestore
          --project demo-catmap-web-test "npm --prefix web run test:e2e -- --project=chromium --project=webkit"
